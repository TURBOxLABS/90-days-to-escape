<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10111a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png"><title>90 Days to Freedom</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#10111a;color:#f5f5f7;font-family:system-ui,Arial}.app{max-width:650px;margin:auto}h1{text-align:center;font-size:clamp(25px,7vw,34px)}.sub,.footer{text-align:center;color:#b8b8c8}.panel{background:#202130;padding:16px;border-radius:16px;margin:14px 0}.stats{display:flex;justify-content:space-between;gap:8px}.stat{text-align:center;flex:1}.num{display:block;font-size:clamp(24px,6vw,30px);font-weight:800}.muted{color:#b8b8c8;font-size:12px}.track{height:12px;background:#414154;border-radius:20px;overflow:hidden;margin:14px 0 8px}#bar{height:100%;background:#8df0b2;width:0}.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.day{background:#292a3c;border:1px solid #414154;color:white;border-radius:12px;padding:11px 2px;min-height:74px;cursor:pointer;font:inherit}.day.done{background:#194c3b;border-color:#8df0b2}.day.today{outline:2px solid #ffc66d}.day strong,.day small{display:block}.day strong{font-size:13px}.day small{font-size:11px;margin-top:5px}.actions{text-align:center;margin:14px}.reset{padding:9px 12px;border-radius:10px;background:transparent;color:#b8b8c8;border:1px solid #57586c}#message{text-align:center;color:#8df0b2;font-weight:750;min-height:24px}.footer{font-size:12px;line-height:1.5}@media(max-width:390px){.days{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><main class="app"><h1>💀 90 Days to Freedom</h1><p class="sub">One day closer to your next chapter. 🛫</p><section class="panel"><div class="stats"><div class="stat"><span class="num" id="left">90</span><span class="muted">Days left</span></div><div class="stat"><span class="num" id="done">0</span><span class="muted">Days deleted</span></div><div class="stat"><span class="num" id="pct">0%</span><span class="muted">Freedom</span></div></div><div class="track"><div id="bar"></div></div><div class="muted" id="dateText"></div></section><section class="panel"><div id="message">Your escape plan is loading... 😈</div></section><div class="days" id="days"></div><div class="actions"><button class="reset" id="reset">Reset all checkmarks</button></div><p class="footer">Tap a day to complete it; tap again to undo.<br>Progress saves on this device and browser.</p></main><script>const startDate=new Date(2026,8,22),totalDays=90,key='freedom90completed';const jokes=['💀 DAY DELETED FROM THE MATRIX!','🚀 THIS DAY HAS BEEN YEETED!','⚰️ RIP, ANOTHER WORKDAY.','📉 NOTICE PERIOD: -1. YOU: +1.','😮‍💨 EXHALE. IT’S DONE.','🛫 FREEDOM LOADING...','🔥 CORPORATE SURVIVAL: +1 XP!','🥳 ONE LESS DAY IN THE SIMULATION!','🧘 BRO, YOUR EXIT ARC IS PROGRESSING.','👑 ANOTHER DAY CLOSER TO YOUR NEXT CHAPTER!'];let completed=[];try{let v=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(v))completed=[...new Set(v.filter(n=>Number.isInteger(n)&&n>=1&&n<=90))]}catch(e){}const daysEl=document.getElementById('days'),msg=document.getElementById('message'),today=new Date();today.setHours(0,0,0,0);function dayDate(n){let d=new Date(startDate);d.setDate(d.getDate()+n-1);return d}function fmt(d){return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}function render(){let count=completed.length;document.getElementById('done').textContent=count;document.getElementById('left').textContent=90-count;document.getElementById('pct').textContent=Math.round(count/90*100)+'%';document.getElementById('bar').style.width=count/90*100+'%';document.getElementById('dateText').textContent='Notice period: 22 Sep – '+fmt(dayDate(90))+' · Today: '+fmt(today);daysEl.innerHTML='';for(let n=1;n<=90;n++){let d=dayDate(n),b=document.createElement('button'),done=completed.includes(n);b.className='day'+(done?' done':'')+(d.getTime()===today.getTime()?' today':'');b.innerHTML='<strong>'+(done?'☑️ ':'⬜ ')+'Day '+n+'</strong><small>'+fmt(d)+'</small>';b.onclick=()=>{if(completed.includes(n)){completed=completed.filter(x=>x!==n);msg.textContent='↩️ Day restored. No worries, bro.'}else{completed.push(n);msg.textContent=jokes[Math.floor(Math.random()*jokes.length)]}try{localStorage.setItem(key,JSON.stringify(completed))}catch(e){}render()};daysEl.appendChild(b)}}document.getElementById('reset').onclick=()=>{if(confirm('Reset all checkmarks?')){completed=[];localStorage.removeItem(key);msg.textContent='🧹 Fresh start. Your freedom arc continues.';render()}};render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));</script></body></html>
